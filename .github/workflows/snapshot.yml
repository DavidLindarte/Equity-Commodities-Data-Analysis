name: snapshot

# Hosted version of the monitor: every 3 hours on weekdays it checks Woodside and Shell
# prices and the Google News volume for each topic, logs them and refreshes the dashboard.
on:
  schedule:
    - cron: "17 */3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git commit -m "snapshot: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "No changes"
          git push
